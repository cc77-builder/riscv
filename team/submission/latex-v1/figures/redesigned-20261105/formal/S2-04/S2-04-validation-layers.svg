<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="126mm" viewBox="0 0 1600 1260" role="img" aria-labelledby="title desc">
<title id="title">S2-04 验证层级、实现范围与独立对照关系</title>
<desc id="desc">嵌套框表示整核含真实VFEX4父级、父级含VDot FU、FU含算术逻辑这一实现关系，并列出各层可观察维度；不表示测试集合全包含或同时进行一次测试。独立整数模型位于硬件之外，与完整128位算术结果对照；NEMU另与整核对应架构状态进行DiffTest差分。八路乘积与四二一归约仅标识算术范围，不增加流水级或时序含义。各层原证据独立保留，图中不预设通过。</desc>
