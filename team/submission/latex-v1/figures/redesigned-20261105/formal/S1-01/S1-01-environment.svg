<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="120mm" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
<title id="title">S1-01 阶段一开发环境、构建产物与差分运行关系</title>
<desc id="desc">2026年10月9日历史环境的功能关系图。Windows宿主承载WSL2 Ubuntu，构建与运行位于WSL原生文件系统。香山Scala/Chisel生成RTL并编译为EMU；AM程序经ELF提取BIN；独立启动汇编产生启动flash；NEMU构建动态参考库。程序BIN与启动flash为两个不同输入，共同用于RTL执行和NEMU参考执行；EMU与参考库的运行使用另行连接。DiffTest比较对应的架构状态，不表示独立操作系统进程、网络拓扑、周期锁步或测试通过。实线为构建依赖，虚线为运行使用关系。</desc>
<style>text {font-family:Microsoft YaHei, 微软雅黑, SimSun, 宋体, "Noto Sans CJK SC", sans-serif;}</style>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#285D84"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#267A78"/></marker>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#263745"/></marker>
</defs>
