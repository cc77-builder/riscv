<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="136mm" viewBox="0 0 1600 1360" role="img" aria-labelledby="title description">
<title id="title">VDot 点积算术与 P/R 寄存器边界</title>
<desc id="description">合法算术路径。每源低 64 位按八个有符号字节相乘，八个 16 位乘积进入 P。P 与 R 之间是组合归约：四个 17 位、两个 18 位、一个 19 位和，再符号扩展为 32 位进入 R。输出高 96 位为零。控制、异常与 perf 随事务同步迁移。三个加法层没有额外流水寄存器。</desc>
<defs><marker id="arrow" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M 1 1 L 12 7 L 1 13 Z" fill="#242424"/></marker></defs>
