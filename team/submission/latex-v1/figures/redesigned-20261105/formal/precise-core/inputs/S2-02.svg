<g transform="translate(0,-70)">
<text x="705" y="132" font-size="40" text-anchor="middle" fill="#242424" font-weight="400">两源各取低64位 · 8路有符号 INT8</text>
<text x="1435" y="132" font-size="40" text-anchor="middle" fill="#242424" font-weight="400">随事务保存</text>
