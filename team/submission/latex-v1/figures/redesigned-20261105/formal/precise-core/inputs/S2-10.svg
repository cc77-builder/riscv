<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="168mm" viewBox="0 0 160 168" role="img" aria-labelledby="title desc">
<title id="title">S2-10</title>
<desc id="desc">空仅表示 valid=0。P/R 各按自身 ROB 匹配取消，reset 禁止接收、迁移和响应。未复位时，存活 P 仅在 R 不存活或 out.ready=1 时迁移；R 阻塞且 P 满时保持并拒收，空 P 仍可吸收有效输入。新接收还须父级准入且无 flush/reset；flush 时幸存 P 可迁移、幸存 R 可完成。ROB、pdest、ctrl/perf 与原事务数据同步移动。</desc>
