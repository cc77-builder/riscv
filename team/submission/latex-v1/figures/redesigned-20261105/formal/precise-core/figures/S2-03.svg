<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="145mm" viewBox="0 0 1600 1450" role="img" aria-labelledby="title description">
<title id="title">VFEX4 的输入派发、独立门控与共享输出</title>
<desc id="description">固定 0f 版本的精确结构示意。三列依次为 VDot、VIDiv、VFDivSqrt。输入 bits 广播，valid 按许可及选中位限定；ready 使用 Mux1H 取选中功能单元。每列独立时钟门控。共享输出有效路至多一条，out.ready 广播。短标签表示同名网络连接，不表示新增端口或状态。</desc>
<defs>
 <marker id="arrow-ink" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="12" refY="7" orient="auto"><path d="M 1 1 L 12 7 L 1 13 Z" fill="#24384A"/></marker>
 <marker id="arrow-clock" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="12" refY="7" orient="auto"><path d="M 1 1 L 12 7 L 1 13 Z" fill="#287F84"/></marker>
</defs>
<rect width="1600" height="1450" fill="#FFFFFF"/>
<g font-family="Microsoft YaHei, 微软雅黑, SimSun, 宋体, &quot;Noto Sans CJK SC&quot;, sans-serif" fill="#24384A" stroke-linecap="round" stroke-linejoin="round">
<g id="input-admission-and-valid">
<text x="40" y="55" font-size="44" text-anchor="start" fill="#24384A" font-weight="700">互斥派发</text>
<text x="40" y="112" font-size="40" text-anchor="start" fill="#24384A" font-weight="400">fuSel = acceptCond(in.bits)</text>
<text x="40" y="175" font-size="40" text-anchor="start" fill="#24384A" font-weight="400">allow = ¬DIV忙</text>
<text x="190" y="230" font-size="40" text-anchor="start" fill="#24384A" font-weight="400">∧ (VDot请求 ∨ ¬VDot忙)</text>
<text x="190" y="285" font-size="40" text-anchor="start" fill="#24384A" font-weight="400">∧ ¬flush.valid ∧ ¬reset</text>
<text x="40" y="350" font-size="40" text-anchor="start" fill="#24384A" font-weight="400">v[i] = in.valid ∧ allow ∧ fuSel[i]</text>
<text x="40" y="415" font-size="40" text-anchor="start" fill="#24384A" font-weight="400">in.ready = allow ∧ selectedReady</text>
</g>
<g id="selected-child-ready">
<text x="1230" y="55" font-size="40" text-anchor="middle" fill="#24384A" font-weight="400">r[i] = FU[i].in.ready</text>
<text x="1030" y="130" font-size="40" text-anchor="middle" fill="#24384A" font-weight="400">rV</text>
<polyline points="1030,145 1030,205" fill="none" stroke="#24384A" stroke-width="3.3" stroke-dasharray="11 9" marker-end="url(#arrow-ink)"/>
<text x="1230" y="130" font-size="40" text-anchor="middle" fill="#24384A" font-weight="400">rI</text>
<polyline points="1230,145 1230,205" fill="none" stroke="#24384A" stroke-width="3.3" stroke-dasharray="11 9" marker-end="url(#arrow-ink)"/>
<text x="1430" y="130" font-size="40" text-anchor="middle" fill="#24384A" font-weight="400">rF</text>
<polyline points="1430,145 1430,205" fill="none" stroke="#24384A" stroke-width="3.3" stroke-dasharray="11 9" marker-end="url(#arrow-ink)"/>
<polygon points="980,205 1480,205 1430,310 1030,310" fill="#E8F2F3" stroke="#24384A" stroke-width="2.6"/>
<text x="1230" y="272" font-size="44" text-anchor="middle" fill="#24384A" font-weight="700">Mux1H</text>
<polyline points="1550,258 1455,258" fill="none" stroke="#24384A" stroke-width="3.3" marker-end="url(#arrow-ink)"/>
<text x="1550" y="180" font-size="40" text-anchor="end" fill="#24384A" font-weight="400">fuSel</text>
<polyline points="1230,310 1230,343" fill="none" stroke="#24384A" stroke-width="3.3" stroke-dasharray="11 9" marker-end="url(#arrow-ink)"/>
<text x="1230" y="393" font-size="40" text-anchor="middle" fill="#24384A" font-weight="400">selectedReady</text>
</g>
<g id="broadcast-input-data">
<text x="60" y="470" font-size="40" text-anchor="start" fill="#24384A" font-weight="400">in.bits 广播</text>
<polyline points="60,505 1510,505" fill="none" stroke="#24384A" stroke-width="3.6"/>
<circle cx="360" cy="505" r="5" fill="#24384A"/>
<polyline points="360,505 360,720" fill="none" stroke="#24384A" stroke-width="3.6" marker-end="url(#arrow-ink)"/>
<circle cx="860" cy="505" r="5" fill="#24384A"/>
<polyline points="860,505 860,720" fill="none" stroke="#24384A" stroke-width="3.6" marker-end="url(#arrow-ink)"/>
<circle cx="1360" cy="505" r="5" fill="#24384A"/>
<polyline points="1360,505 1360,720" fill="none" stroke="#24384A" stroke-width="3.6" marker-end="url(#arrow-ink)"/>
</g>
<g id="output-ready-broadcast">
<polyline points="1550,1375 60,1375" fill="none" stroke="#24384A" stroke-width="3.3" stroke-dasharray="11 9"/>
<circle cx="545" cy="1375" r="4" fill="#24384A"/>
<polyline points="545,1375 545,995 485,995 485,960" fill="none" stroke="#24384A" stroke-width="3.3" stroke-dasharray="11 9" marker-end="url(#arrow-ink)"/>
<circle cx="1045" cy="1375" r="4" fill="#24384A"/>
<polyline points="1045,1375 1045,995 985,995 985,960" fill="none" stroke="#24384A" stroke-width="3.3" stroke-dasharray="11 9" marker-end="url(#arrow-ink)"/>
<circle cx="1545" cy="1375" r="4" fill="#24384A"/>
<polyline points="1545,1375 1545,995 1485,995 1485,960" fill="none" stroke="#24384A" stroke-width="3.3" stroke-dasharray="11 9" marker-end="url(#arrow-ink)"/>
<text x="1550" y="1430" font-size="40" text-anchor="end" fill="#24384A" font-weight="400">out.ready 广播</text>
</g>
<g id="fu-VDot">
<polyline points="425,645 425,720" fill="none" stroke="#24384A" stroke-width="3.3" marker-end="url(#arrow-ink)"/>
<text x="425" y="622" font-size="40" text-anchor="middle" fill="#24384A" font-weight="400">vV</text>
<polyline points="485,720 485,645" fill="none" stroke="#24384A" stroke-width="3.3" stroke-dasharray="11 9" marker-end="url(#arrow-ink)"/>
<text x="485" y="622" font-size="40" text-anchor="middle" fill="#24384A" font-weight="400">rV</text>
<rect x="210" y="720" width="300" height="240" rx="5" fill="#E8F2F3" stroke="#24384A" stroke-width="2.6"/>
<text x="360" y="777" font-size="44" text-anchor="middle" fill="#24384A" font-weight="700">VDot</text>
<rect x="245" y="815" width="80" height="70" rx="1" fill="#FFFFFF" stroke="#24384A" stroke-width="2.6"/>
<rect x="395" y="815" width="80" height="70" rx="1" fill="#FFFFFF" stroke="#24384A" stroke-width="2.6"/>
<text x="285" y="863" font-size="44" text-anchor="middle" fill="#24384A" font-weight="400">P</text>
<text x="435" y="863" font-size="44" text-anchor="middle" fill="#24384A" font-weight="400">R</text>
<polyline points="325,850 395,850" fill="none" stroke="#24384A" stroke-width="3.3" marker-end="url(#arrow-ink)"/>
</g>
<g id="clock-gate-VDot">
<polyline points="30,860 90,860" fill="none" stroke="#287F84" stroke-width="3.3"/>
<text x="55" y="835" font-size="40" text-anchor="middle" fill="#287F84" font-weight="400">clk</text>
<rect x="90" y="820" width="90" height="80" rx="3" fill="#FFFFFF" stroke="#287F84" stroke-width="2.6"/>
<text x="135" y="873" font-size="40" text-anchor="middle" fill="#287F84" font-weight="400">CG</text>
<polyline points="135,780 135,820" fill="none" stroke="#287F84" stroke-width="3.3"/>
<text x="135" y="759" font-size="40" text-anchor="middle" fill="#287F84" font-weight="400">enV</text>
<polyline points="180,860 210,860" fill="none" stroke="#287F84" stroke-width="3.3"/>
<polygon points="210,848 226,860 210,872" fill="#FFFFFF" stroke="#287F84" stroke-width="2.6"/>
</g>
<g id="fu-VIDiv">
<polyline points="925,645 925,720" fill="none" stroke="#24384A" stroke-width="3.3" marker-end="url(#arrow-ink)"/>
<text x="925" y="622" font-size="40" text-anchor="middle" fill="#24384A" font-weight="400">vI</text>
<polyline points="985,720 985,645" fill="none" stroke="#24384A" stroke-width="3.3" stroke-dasharray="11 9" marker-end="url(#arrow-ink)"/>
<text x="985" y="622" font-size="40" text-anchor="middle" fill="#24384A" font-weight="400">rI</text>
<rect x="710" y="720" width="300" height="240" rx="5" fill="#E8F2F3" stroke="#24384A" stroke-width="2.6"/>
<text x="860" y="777" font-size="44" text-anchor="middle" fill="#24384A" font-weight="700">VIDiv</text>
<text x="860" y="885" font-size="68" text-anchor="middle" fill="#24384A" font-weight="400">÷</text>
</g>
<g id="clock-gate-VIDiv">
<polyline points="530,860 590,860" fill="none" stroke="#287F84" stroke-width="3.3"/>
<text x="555" y="835" font-size="40" text-anchor="middle" fill="#287F84" font-weight="400">clk</text>
<rect x="590" y="820" width="90" height="80" rx="3" fill="#FFFFFF" stroke="#287F84" stroke-width="2.6"/>
<text x="635" y="873" font-size="40" text-anchor="middle" fill="#287F84" font-weight="400">CG</text>
<polyline points="635,780 635,820" fill="none" stroke="#287F84" stroke-width="3.3"/>
<text x="635" y="759" font-size="40" text-anchor="middle" fill="#287F84" font-weight="400">enI</text>
<polyline points="680,860 710,860" fill="none" stroke="#287F84" stroke-width="3.3"/>
<polygon points="710,848 726,860 710,872" fill="#FFFFFF" stroke="#287F84" stroke-width="2.6"/>
</g>
<g id="fu-VFDivSqrt">
<polyline points="1425,645 1425,720" fill="none" stroke="#24384A" stroke-width="3.3" marker-end="url(#arrow-ink)"/>
<text x="1425" y="622" font-size="40" text-anchor="middle" fill="#24384A" font-weight="400">vF</text>
<polyline points="1485,720 1485,645" fill="none" stroke="#24384A" stroke-width="3.3" stroke-dasharray="11 9" marker-end="url(#arrow-ink)"/>
<text x="1485" y="622" font-size="40" text-anchor="middle" fill="#24384A" font-weight="400">rF</text>
<rect x="1210" y="720" width="300" height="240" rx="5" fill="#E8F2F3" stroke="#24384A" stroke-width="2.6"/>
<text x="1360" y="777" font-size="44" text-anchor="middle" fill="#24384A" font-weight="700">VFDivSqrt</text>
<text x="1360" y="880" font-size="40" text-anchor="middle" fill="#24384A" font-weight="400">静态结构</text>
</g>
<g id="clock-gate-VFDivSqrt">
<polyline points="1030,860 1090,860" fill="none" stroke="#287F84" stroke-width="3.3"/>
<text x="1055" y="835" font-size="40" text-anchor="middle" fill="#287F84" font-weight="400">clk</text>
<rect x="1090" y="820" width="90" height="80" rx="3" fill="#FFFFFF" stroke="#287F84" stroke-width="2.6"/>
<text x="1135" y="873" font-size="40" text-anchor="middle" fill="#287F84" font-weight="400">CG</text>
<polyline points="1135,780 1135,820" fill="none" stroke="#287F84" stroke-width="3.3"/>
<text x="1135" y="759" font-size="40" text-anchor="middle" fill="#287F84" font-weight="400">enF</text>
<polyline points="1180,860 1210,860" fill="none" stroke="#287F84" stroke-width="3.3"/>
<polygon points="1210,848 1226,860 1210,872" fill="#FFFFFF" stroke="#287F84" stroke-width="2.6"/>
</g>
<g id="shared-one-hot-output">
<polyline points="360,960 360,1080 660,1080 660,1120" fill="none" stroke="#FFFFFF" stroke-width="13.3"/>
<polyline points="360,960 360,1080 660,1080 660,1120" fill="none" stroke="#24384A" stroke-width="3.3" marker-end="url(#arrow-ink)"/>
<polyline points="860,960 860,1120" fill="none" stroke="#FFFFFF" stroke-width="13.3"/>
<polyline points="860,960 860,1120" fill="none" stroke="#24384A" stroke-width="3.3" marker-end="url(#arrow-ink)"/>
<polyline points="1360,960 1360,1080 960,1080 960,1120" fill="none" stroke="#FFFFFF" stroke-width="13.3"/>
<polyline points="1360,960 1360,1080 960,1080 960,1120" fill="none" stroke="#24384A" stroke-width="3.3" marker-end="url(#arrow-ink)"/>
<polygon points="620,1120 1020,1120 980,1240 660,1240" fill="#E8F2F3" stroke="#24384A" stroke-width="2.6"/>
<text x="820" y="1194" font-size="44" text-anchor="middle" fill="#24384A" font-weight="700">Mux1H</text>
<polyline points="1190,1175 1002,1175" fill="none" stroke="#FFFFFF" stroke-width="13.3"/>
<polyline points="1190,1175 1002,1175" fill="none" stroke="#24384A" stroke-width="3.3" marker-end="url(#arrow-ink)"/>
<text x="1150" y="1151" font-size="40" text-anchor="middle" fill="#24384A" font-weight="400">valid_i</text>
<polyline points="820,1240 820,1300" fill="none" stroke="#24384A" stroke-width="3.3" marker-end="url(#arrow-ink)"/>
<text x="820" y="1350" font-size="44" text-anchor="middle" fill="#24384A" font-weight="700">输出</text>
<text x="50" y="1220" font-size="40" text-anchor="start" fill="#24384A" font-weight="400">out.valid = OR(valid_i)</text>
<text x="50" y="1285" font-size="40" text-anchor="start" fill="#24384A" font-weight="400">至多一路有效</text>
</g>
</g>
</svg>
