<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="122mm" viewBox="0 0 1600 1220" role="img" aria-labelledby="title desc">
<title id="title">S3-01 两种独立求值结构及对应架构状态比较</title>
<desc id="desc">相同程序与初始状态分别进入RTL与NEMU。RTL示意八对有符号字节相乘及组合平衡归约；NEMU示意逐项乘法、从零开始的sum反馈及循环结束。算术结果仅写入各模型向量状态，CSR与异常来自各模型整体状态。三个中性比较节点分别接收一份DUT和一份参考的同类状态。图中不表示周期、完整硬件布线或测试通过。</desc>
