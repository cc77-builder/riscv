<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="168mm" viewBox="0 0 160 168" version="1.1" role="img">
  <title>NEMU vdot 的识别、状态检查与独立执行</title>
  <desc>Exact custom-0 pattern matching is followed by all vector-state checks. Nonmatching instructions continue other decode. An illegal matched state raises cause 2 before source reads or destination writes. The legal path snapshots both low64 sources, calculates eight signed INT8 products, writes the entire 128-bit destination with high96 zero and low32 sum, then marks VS dirty. This is a source-level interpreter control flow, not DUT-cycle timing.</desc>
  <defs>
    <marker id="gray" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="2.2" markerHeight="2.2" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#637487" />
    </marker>
    <marker id="teal" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="2.2" markerHeight="2.2" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#287F84" />
    </marker>
    <marker id="red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="2.2" markerHeight="2.2" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#AA4054" />
    </marker>
  </defs>
  <rect x="0" y="0" width="160" height="168" fill="white" stroke="none" stroke-width="0.28" />
  <text x="80" y="7" font-size="4.056944" font-family="DejaVu Sans Mono" fill="#24384A" text-anchor="middle" font-weight="400">(inst &amp; 0xFE00707F) == 0x0200000B</text>
  <path d="M 50 11 V 17" fill="none" stroke="#637487" stroke-width="0.32" marker-end="url(#gray)" />
  <path d="M 7.0 27 L 50 17.0 L 93.0 27 L 50 37.0 Z" fill="white" stroke="#24384A" stroke-width="0.3" />
  <text x="50" y="28.5" font-size="4.233333" font-family="Noto Sans CJK SC" fill="#24384A" text-anchor="middle" font-weight="400">匹配 vdot？</text>
  <path d="M 93 27 H 112" fill="none" stroke="#637487" stroke-width="0.32" marker-end="url(#gray)" />
  <text x="102.5" y="23.3" font-size="4.056944" font-family="Noto Sans CJK SC" fill="#637487" text-anchor="middle" font-weight="400">否</text>
  <rect x="112" y="20" width="43" height="14" fill="#F2F5F8" stroke="#CED9E2" stroke-width="0.28" />
  <text x="133.5" y="28.5" font-size="4.056944" font-family="Noto Sans CJK SC" fill="#24384A" text-anchor="middle" font-weight="400">其他译码</text>
  <path d="M 50 37 V 53" fill="none" stroke="#287F84" stroke-width="0.32" marker-end="url(#teal)" />
  <text x="56" y="46" font-size="4.056944" font-family="Noto Sans CJK SC" fill="#287F84" text-anchor="start" font-weight="400">是</text>
  <path d="M 3.0 74 L 50 53.0 L 97.0 74 L 50 95.0 Z" fill="white" stroke="#24384A" stroke-width="0.3" />
  <text x="50" y="67.3" font-size="4.056944" font-family="Noto Sans CJK SC" fill="#24384A" text-anchor="middle" font-weight="400">VS 启用 · vtype 合法</text>
  <text x="50" y="75.6" font-size="4.056944" font-family="Noto Sans CJK SC" fill="#24384A" text-anchor="middle" font-weight="400">e8 / m1 · vl = 8</text>
  <text x="50" y="83.9" font-size="4.056944" font-family="Noto Sans CJK SC" fill="#24384A" text-anchor="middle" font-weight="400">vstart = 0</text>
  <path d="M 97 74 H 112" fill="none" stroke="#AA4054" stroke-width="0.32" marker-end="url(#red)" />
  <text x="104.5" y="70.3" font-size="4.056944" font-family="Noto Sans CJK SC" fill="#AA4054" text-anchor="middle" font-weight="400">否</text>
  <rect x="112" y="60" width="43" height="29" fill="#F8EEF0" stroke="#AA4054" stroke-width="0.28" />
  <text x="133.5" y="68" font-size="4.056944" font-family="Noto Sans CJK SC" fill="#AA4054" text-anchor="middle" font-weight="400">非法指令</text>
  <text x="133.5" y="76.2" font-size="4.056944" font-family="DejaVu Sans Mono" fill="#AA4054" text-anchor="middle" font-weight="400">cause = 2</text>
  <text x="133.5" y="84.4" font-size="4.056944" font-family="Noto Sans CJK SC" fill="#AA4054" text-anchor="middle" font-weight="400">vd 不写回</text>
  <path d="M 50 95 V 104" fill="none" stroke="#287F84" stroke-width="0.32" marker-end="url(#teal)" />
  <text x="56" y="101" font-size="4.056944" font-family="Noto Sans CJK SC" fill="#287F84" text-anchor="start" font-weight="400">是</text>
  <rect x="5" y="104" width="90" height="13" fill="#E8F2F3" stroke="#287F84" stroke-width="0.28" />
  <text x="50" y="112.4" font-size="4.056944" font-family="Noto Sans CJK SC" fill="#24384A" text-anchor="middle" font-weight="400">快照 vs1、vs2 的低64位</text>
  <text x="112" y="109" font-size="4.056944" font-family="Noto Sans CJK SC" fill="#637487" text-anchor="start" font-weight="400">允许目的/源别名</text>
  <text x="112" y="117" font-size="4.056944" font-family="Noto Sans CJK SC" fill="#637487" text-anchor="start" font-weight="400">先读，后写</text>
  <path d="M 101 110.5 H 95" fill="none" stroke="#637487" stroke-width="0.32" stroke-dasharray="1 1" />
  <path d="M 50 117 V 126" fill="none" stroke="#287F84" stroke-width="0.32" marker-end="url(#teal)" />
  <rect x="5" y="126" width="90" height="13" fill="white" stroke="#287F84" stroke-width="0.28" />
  <text x="50" y="134.4" font-size="4.056944" font-family="Noto Sans CJK SC" fill="#24384A" text-anchor="middle" font-weight="400">Σ a[i] × b[i]，i = 0…7</text>
  <text x="112" y="134.4" font-size="4.056944" font-family="Noto Sans CJK SC" fill="#637487" text-anchor="start" font-weight="400">有符号 INT8</text>
  <path d="M 50 139 V 148" fill="none" stroke="#287F84" stroke-width="0.32" marker-end="url(#teal)" />
  <text x="19" y="145.8" font-size="4.056944" font-family="DejaVu Sans Mono" fill="#637487" text-anchor="start" font-weight="400">127:32</text>
  <text x="83.75" y="145.8" font-size="4.056944" font-family="DejaVu Sans Mono" fill="#637487" text-anchor="middle" font-weight="400">31:0</text>
  <rect x="5" y="148" width="67.5" height="9" fill="#F2F5F8" stroke="#637487" stroke-width="0.28" />
  <rect x="72.5" y="148" width="22.5" height="9" fill="#E8F2F3" stroke="#287F84" stroke-width="0.28" />
  <text x="38.75" y="154.3" font-size="4.056944" font-family="Noto Sans CJK SC" fill="#24384A" text-anchor="middle" font-weight="400">高96位 = 0</text>
  <text x="83.75" y="154.3" font-size="4.056944" font-family="DejaVu Sans Mono" fill="#24384A" text-anchor="middle" font-weight="400">sum</text>
  <text x="112" y="154.3" font-size="4.056944" font-family="Noto Sans CJK SC" fill="#637487" text-anchor="start" font-weight="400">128 位写回</text>
  <path d="M 50 157 V 161" fill="none" stroke="#287F84" stroke-width="0.32" marker-end="url(#teal)" />
  <text x="50" y="166" font-size="4.056944" font-family="Noto Sans CJK SC" fill="#24384A" text-anchor="middle" font-weight="400">VS ← Dirty</text>
</svg>