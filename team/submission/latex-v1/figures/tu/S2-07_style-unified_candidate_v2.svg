<text x="8.000" y="60.200" font-family="Noto Serif CJK SC" font-size="2.8928" font-weight="400" text-anchor="start" fill="#526775">示例 out.ready = 0；重定向当拍无新接收。删除线：取消；虚线框：无效槽。</text>
