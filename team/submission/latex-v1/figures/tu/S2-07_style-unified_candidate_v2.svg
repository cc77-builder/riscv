<title id="title">双槽取消与复位的四个独立场景</title>
<desc id="description">以当前边沿前后状态说明仅取消P、仅取消R、两槽取消、reset与redirect同拍。共同示例out.ready=0，重定向当拍没有新接收；幸存R保持，幸存P可在被取消R释放后推进。</desc>
