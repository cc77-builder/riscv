<title id="title">双槽取消与复位的四个独立场景</title>
<desc id="description">以同一边沿前后状态说明仅取消P、仅取消R、两槽取消、复位与重定向同拍。共同条件out.ready=0，重定向当拍没有新接收。删除线表示取消，虚线框表示无效槽。前状态均为P=A、R=B；后状态分别为无效/B、无效/A、两槽无效、两槽无效。第四栏复位优先。</desc>
