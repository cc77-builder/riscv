  <ns0:desc id="desc">Coverage of the fixed eight-term dot product measurement objects. Solid symbols indicate a recorded result, including non-converged STA. Open symbols identify future physical evaluation. Software physical costs are evaluated with the associated hardware. Original source records remain in the repository.</ns0:desc>
